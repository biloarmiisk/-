<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Quiz App</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 24px;
            box-sizing: border-box;
        }
        h1, h2 {
            margin-top: 0;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .option-btn {
            background-color: #f1f5f9;
            color: var(--text);
            text-align: left;
            border: 1px solid var(--border);
        }
        .option-btn:hover {
            background-color: #e2e8f0;
        }
        .hidden {
            display: none;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Subject Selection View -->
    <div id="subject-view">
        <h1>Select a Subject</h1>
        <div id="subject-list"></div>
    </div>

    <!-- Quiz View -->
    <div id="quiz-view" class="hidden">
        <div class="quiz-header">
            <span id="question-count">Question 1 of 3</span>
            <span id="score-tracker">Score: 0</span>
        </div>
        <h2 id="question-text">Question goes here</h2>
        <div id="options-list"></div>
    </div>

    <!-- Results View -->
    <div id="result-view" class="hidden">
        <h2>Quiz Completed! 🎉</h2>
        <p id="final-score" style="text-align: center; font-size: 18px; margin: 20px 0;"></p>
        <button class="btn" onclick="showSubjects()">Back to Subjects</button>
    </div>
</div>

<script>
    // ADD YOUR SUBJECTS AND QUESTIONS HERE
    const quizData = {
        "Biology": [
            {
                q: "What is the powerhouse of the cell?",
                options: ["Nucleus", "Mitochondria", "Ribosome", "Endoplasmic Reticulum"],
                answer: 1
            },
            {
                q: "Which gas do plants absorb from the atmosphere?",
                options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"],
                answer: 2
            }
        ],
        "History": [
            {
                q: "In what year did World War II end?",
                options: ["1940", "1945", "1950", "1939"],
                answer: 1
            }
        ]
    };

    let currentSubject = "";
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    const subjectView = document.getElementById("subject-view");
    const quizView = document.getElementById("quiz-view");
    const resultView = document.getElementById("result-view");
    const subjectList = document.getElementById("subject-list");
    const questionText = document.getElementById("question-text");
    const optionsList = document.getElementById("options-list");
    const questionCount = document.getElementById("question-count");
    const scoreTracker = document.getElementById("score-tracker");
    const finalScore = document.getElementById("final-score");

    function initSubjects() {
        subjectList.innerHTML = "";
        for (let subject in quizData) {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = subject;
            btn.onclick = () => startQuiz(subject);
            subjectList.appendChild(btn);
        }
    }

    function startQuiz(subject) {
        currentSubject = subject;
        currentQuestions = quizData[subject];
        currentIndex = 0;
        score = 0;
        
        subjectView.classList.add("hidden");
        resultView.classList.add("hidden");
        quizView.classList.remove("hidden");
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            showResults();
            return;
        }

        const q = currentQuestions[currentIndex];
        questionCount.innerText = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
        scoreTracker.innerText = `Score: ${score}`;
        questionText.innerText = q.q;
        
        optionsList.innerHTML = "";
        q.options.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.className = "btn option-btn";
            btn.innerText = option;
            btn.onclick = () => selectAnswer(index, q.answer);
            optionsList.appendChild(btn);
        });
    }

    function selectAnswer(selected, correct) {
        if (selected === correct) {
            score++;
        }
        currentIndex++;
        loadQuestion();
    }

    function showResults() {
        quizView.classList.add("hidden");
        resultView.classList.remove("hidden");
        finalScore.innerText = `You scored ${score} out of ${currentQuestions.length} in ${currentSubject}!`;
    }

    function showSubjects() {
        resultView.classList.add("hidden");
        subjectView.classList.remove("hidden");
    }

    initSubjects();
</script>

</body>
</html>
